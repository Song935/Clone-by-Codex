name: Windows build and CAD verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent PDF verifier
        run: python -m pip install pymupdf==1.26.7
      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1 -PdfCheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-verification
          path: artifacts/
